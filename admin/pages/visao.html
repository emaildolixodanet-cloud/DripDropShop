<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0A0A0F">
  <title>Visão · DripDrop Admin</title>

  <link rel="manifest" href="../manifest.json">
  <link rel="apple-touch-icon" sizes="180x180" href="../assets/logo-180.png">
  <script src="../scripts/auth-check.js"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;700&family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../styles/design-system.css">

  <style>
    /* Sub-tabs */
    .sub-tabs { display:flex;gap:4px;background:var(--bg-elevated);border:1px solid var(--border-subtle);border-radius:var(--radius-lg);padding:4px;margin-bottom:var(--space-lg); }
    .sub-tab { flex:1;padding:10px 16px;border:none;border-radius:var(--radius-md);background:transparent;color:var(--text-tertiary);font-family:var(--font-accent);font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:0.5px;cursor:pointer;transition:none;text-align:center; }
    .sub-tab.active { background:var(--primary);color:#fff;box-shadow:0 2px 8px var(--primary-glow); }
    .tab-panel { display:none; }
    .tab-panel.active { display:block; }

    /* Search bar */
    .search-bar { position:relative;margin-bottom:var(--space-md); }
    .search-bar input { width:100%;padding:12px 16px 12px 40px;background:var(--bg-elevated);border:1px solid var(--border-subtle);border-radius:var(--radius-lg);color:var(--text-primary);font-size:15px;font-family:var(--font-body);transition:none; }
    .search-bar input:focus { outline:none;border-color:var(--primary); }
    .search-bar input::placeholder { color:var(--text-tertiary); }
    .search-bar::before { content:'🔍';position:absolute;left:14px;top:50%;transform:translateY(-50%);font-size:14px; }

    /* Filter chips */
    .filter-row { display:flex;gap:8px;overflow-x:auto;margin-bottom:var(--space-lg);padding-bottom:4px;-webkit-overflow-scrolling:touch; }
    .filter-row::-webkit-scrollbar { display:none; }
    .chip { padding:6px 14px;border-radius:var(--radius-full);border:1px solid var(--border-subtle);background:transparent;color:var(--text-secondary);font-family:var(--font-accent);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.5px;cursor:pointer;white-space:nowrap;transition:none; }
    .chip.active { background:var(--primary);border-color:var(--primary);color:#fff; }

    /* Groups */
    .group-section { margin-bottom:var(--space-lg); }
    .group-header { display:flex;justify-content:space-between;align-items:center;padding:12px var(--space-md);background:var(--bg-elevated);border:1px solid var(--border-subtle);border-radius:var(--radius-lg);cursor:pointer;margin-bottom:var(--space-sm); }
    .group-header__left { display:flex;align-items:center;gap:10px;flex:1;min-width:0; }
    .group-header__name { font-family:var(--font-display);font-size:14px;font-weight:700; }
    .group-header__count { font-size:12px;color:var(--text-tertiary);background:rgba(255,255,255,0.06);padding:2px 8px;border-radius:var(--radius-full); }
    .group-header__actions { display:flex;gap:6px;align-items:center; }
    .group-content { padding-left:0; }
    .group-content.collapsed { display:none; }

    /* Op item */
    .op-item { background:var(--bg-elevated);border:1px solid var(--border-subtle);border-radius:var(--radius-md);padding:var(--space-md);margin-bottom:var(--space-xs);display:flex;justify-content:space-between;align-items:center;gap:8px; }
    .op-item.selected { border-color:var(--primary);background:rgba(0,119,130,0.08); }
    .op-item__info { flex:1;min-width:0; }
    .op-item__title { font-family:var(--font-display);font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis; }
    .op-item__meta { font-size:11px;color:var(--text-secondary);margin-top:2px; }
    .op-item__stock { font-family:var(--font-display);font-size:18px;font-weight:700;min-width:32px;text-align:center; }
    .sell-btn { padding:7px 12px;border:none;border-radius:var(--radius-md);background:rgba(0,230,118,0.15);border:1px solid rgba(0,230,118,0.3);color:var(--success);font-family:var(--font-accent);font-size:11px;font-weight:700;cursor:pointer;text-transform:uppercase;letter-spacing:0.5px;transition:none;white-space:nowrap; }

    /* Selection toolbar */
    .selection-bar { position:sticky;top:calc(60px + env(safe-area-inset-top, 0px));z-index:40;background:var(--primary);border-radius:var(--radius-md);padding:10px 14px;margin-bottom:var(--space-md);display:none;align-items:center;justify-content:space-between;gap:8px; }
    .selection-bar.active { display:flex; }
    .selection-bar__text { font-family:var(--font-accent);font-size:12px;font-weight:700;color:#fff;letter-spacing:0.5px; }
    .selection-bar__actions { display:flex;gap:6px; }
    .sel-btn { padding:6px 12px;border:none;border-radius:var(--radius-sm);font-family:var(--font-accent);font-size:11px;font-weight:700;cursor:pointer;text-transform:uppercase;letter-spacing:0.5px; }
    .sel-btn--move { background:rgba(255,255,255,0.2);color:#fff; }
    .sel-btn--cancel { background:rgba(255,255,255,0.1);color:rgba(255,255,255,0.7); }

    /* Tiny icon buttons */
    .gbtn { width:28px;height:28px;border:none;border-radius:var(--radius-sm);background:rgba(255,255,255,0.06);color:var(--text-tertiary);font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center; }

    /* Analytics */
    .stat-grid { display:grid;grid-template-columns:1fr 1fr;gap:var(--space-md);margin-bottom:var(--space-lg); }
    .stat-card { background:var(--bg-elevated);border:1px solid var(--border-subtle);border-radius:var(--radius-lg);padding:var(--space-lg);text-align:center; }
    .stat-card__label { font-family:var(--font-accent);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.5px;color:var(--text-tertiary);margin-bottom:8px; }
    .stat-card__value { font-family:var(--font-display);font-size:24px;font-weight:700; }
    .stat-card__value.positive { color:var(--success); }
    .stat-card__value.negative { color:var(--critical); }
    .stat-card__value.neutral { color:var(--primary-light); }
    .sale-row { display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--border-subtle);font-size:14px; }
    .sale-row:last-child { border-bottom:none; }
    .sale-date { font-size:12px;color:var(--text-tertiary); }
    .sale-amount { font-family:var(--font-display);font-weight:700;color:var(--success); }
    .sale-product { font-weight:600; }
    .sale-profit { font-size:12px; }
    .sale-profit.positive { color:var(--success); }
    .sale-profit.negative { color:var(--critical); }
    .section-label { font-family:var(--font-accent);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--text-tertiary);margin-bottom:var(--space-md);margin-top:var(--space-lg); }
  </style>
</head>
<body>

  <header class="app-header">
    <button class="app-header__back" onclick="window.history.back()">← Voltar</button>
    <h1 class="app-header__title">VISÃO</h1>
    <div class="app-header__actions"></div>
  </header>

  <main class="container section">

    <div class="sub-tabs">
      <button class="sub-tab active" data-tab="operacoes">Operações</button>
      <button class="sub-tab" data-tab="analytics">Analytics</button>
    </div>

    <!-- ====== OPERAÇÕES ====== -->
    <div class="tab-panel active" id="panel-operacoes">

      <div class="card card--glass mb-lg">
        <div class="flex justify-between items-center">
          <div>
            <div class="text-tertiary text-sm text-accent">EM ARMAZÉM</div>
            <div class="text-display" style="font-size:28px" id="opUnits">0</div>
          </div>
          <div class="text-right">
            <div class="text-tertiary text-sm text-accent">VENDAS HOJE</div>
            <div class="text-display" style="font-size:28px;color:var(--success)" id="opSalesToday">0</div>
          </div>
        </div>
      </div>

      <!-- Search -->
      <div class="search-bar">
        <input type="text" id="searchInput" placeholder="Pesquisar artigo...">
      </div>

      <!-- Filters -->
      <div class="filter-row" id="filterRow"></div>

      <!-- Selection bar -->
      <div class="selection-bar" id="selectionBar">
        <span class="selection-bar__text" id="selCount">0 selecionados</span>
        <div class="selection-bar__actions">
          <button class="sel-btn sel-btn--move" id="selMove">📁 Mover</button>
          <button class="sel-btn sel-btn--move" id="selRemove">❌ Remover</button>
          <button class="sel-btn sel-btn--cancel" id="selCancel">Cancelar</button>
        </div>
      </div>

      <!-- Groups + Items -->
      <div style="margin-bottom:var(--space-md)">
        <button class="btn btn--primary" style="width:100%" id="addGroupBtn">➕ Novo Grupo</button>
      </div>

      <div id="opList"></div>

      <div class="empty-state" id="opEmpty" style="display:none">
        <div class="empty-state__icon">📊</div>
        <h3 class="empty-state__title">Sem stock</h3>
        <p class="empty-state__description">Adiciona produtos no Stock primeiro.</p>
      </div>
    </div>

    <!-- ====== ANALYTICS ====== -->
    <div class="tab-panel" id="panel-analytics">
      <div class="stat-grid">
        <div class="stat-card"><div class="stat-card__label">Investimento</div><div class="stat-card__value neutral" id="anInvestment">0€</div></div>
        <div class="stat-card"><div class="stat-card__label">Receita</div><div class="stat-card__value positive" id="anRevenue">0€</div></div>
        <div class="stat-card"><div class="stat-card__label">Lucro</div><div class="stat-card__value" id="anProfit">0€</div></div>
        <div class="stat-card"><div class="stat-card__label">Margem</div><div class="stat-card__value" id="anMargin">0%</div></div>
      </div>
      <div class="stat-grid" style="grid-template-columns:1fr">
        <div class="stat-card"><div class="stat-card__label">Total vendas</div><div class="text-display" style="font-size:32px" id="anSalesCount">0</div></div>
      </div>
      <div class="section-label">Histórico de Vendas</div>
      <div class="card" id="salesHistory">
        <div class="empty-state" style="padding:var(--space-lg)">
          <div style="font-size:32px;opacity:0.5;margin-bottom:8px">📋</div>
          <p class="text-sm text-secondary">Nenhuma venda registada.</p>
        </div>
      </div>
    </div>

  </main>

  <!-- SELL MODAL -->
  <div class="modal-backdrop" id="sellModal">
    <div class="modal">
      <div class="modal__handle"></div>
      <div class="modal__header"><h2 class="modal__title">Registar Venda</h2></div>
      <div id="sellInfo" style="margin-bottom:var(--space-md)"></div>
      <div class="input-group">
        <label class="input-label" for="sm_qty">Quantidade</label>
        <input class="input" type="number" id="sm_qty" value="1" min="1"/>
      </div>
      <div class="input-group">
        <label class="input-label" for="sm_price">Valor de venda (€)</label>
        <input class="input" type="number" id="sm_price" placeholder="0.00" step="0.01" min="0"/>
      </div>
      <div class="modal__actions">
        <button class="btn btn--secondary" id="sellCancel">Cancelar</button>
        <button class="btn btn--primary" id="sellConfirm">Confirmar Venda</button>
      </div>
    </div>
  </div>

  <!-- MOVE-TO-GROUP MODAL -->
  <div class="modal-backdrop" id="moveModal">
    <div class="modal">
      <div class="modal__handle"></div>
      <div class="modal__header"><h2 class="modal__title">Mover para grupo</h2></div>
      <div id="moveGroupList" style="margin-bottom:var(--space-md)"></div>
      <div class="modal__actions">
        <button class="btn btn--secondary" id="moveCancel">Cancelar</button>
      </div>
    </div>
  </div>

  <!-- TAB BAR -->
  <nav class="tab-bar">
    <a href="./stock.html" class="tab-bar__item"><span class="tab-bar__icon">📦</span><span>Stock</span></a>
    <a href="./site.html" class="tab-bar__item"><span class="tab-bar__icon">🌐</span><span>Site</span></a>
    <a href="./visao.html" class="tab-bar__item active"><span class="tab-bar__icon">📊</span><span>Visão</span></a>
    <a href="./extra.html" class="tab-bar__item"><span class="tab-bar__icon">🔮</span><span>Extra</span></a>
    <a href="./settings.html" class="tab-bar__item"><span class="tab-bar__icon">⚙️</span><span>Config</span></a>
  </nav>

  <script>
    // ==========================================
    // VISÃO - OPERAÇÕES + ANALYTICS
    // ==========================================

    // --- DATA ---
    let stockItems = [
      { id:"RL-HOODIE", color:"Azul", size:"M", stock:5 },
      { id:"RL-HOODIE", color:"Azul", size:"L", stock:2 },
      { id:"RL-HOODIE", color:"Verde", size:"M", stock:1 },
      { id:"CARH-JACKET", color:"Preto", size:"L", stock:3 }
    ];
    let costPrices = { "RL-HOODIE":18, "CARH-JACKET":25 };
    let sales = JSON.parse(localStorage.getItem('dd-sales') || '[]');

    // Groups: { name, itemKeys[], collapsed }
    // itemKey = "idx:0" referencing stockItems index
    let groups = JSON.parse(localStorage.getItem('dd-groups') || 'null') || [];
    // collapsedGroups tracks collapsed state
    let collapsedGroups = JSON.parse(localStorage.getItem('dd-groups-collapsed') || '{}');

    // Selection
    let selectedItems = new Set(); // set of stockItem indices
    let searchQuery = '';
    let activeFilter = 'all'; // 'all', product ID, or group name

    function saveData() {
      localStorage.setItem('dd-sales', JSON.stringify(sales));
      localStorage.setItem('dd-groups', JSON.stringify(groups));
      localStorage.setItem('dd-groups-collapsed', JSON.stringify(collapsedGroups));
    }

    // Unique key for a stock item
    function itemKey(idx) { return idx; }

    // Which group is an item in? Returns group index or -1
    function getItemGroup(idx) {
      return groups.findIndex(g => g.items.includes(idx));
    }

    // Get items NOT in any group
    function ungroupedItems() {
      const grouped = new Set(groups.flatMap(g => g.items));
      return stockItems.map((_, i) => i).filter(i => !grouped.has(i));
    }

    // --- SUB TABS ---
    document.querySelectorAll('.sub-tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.sub-tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
        tab.classList.add('active');
        document.getElementById('panel-' + tab.dataset.tab).classList.add('active');
        if (tab.dataset.tab === 'analytics') renderAnalytics();
      });
    });

    // --- SEARCH ---
    document.getElementById('searchInput').addEventListener('input', (e) => {
      searchQuery = e.target.value.toLowerCase().trim();
      renderOperations();
    });

    // --- FILTERS ---
    function renderFilters() {
      const row = document.getElementById('filterRow');
      row.innerHTML = '';

      const productIds = [...new Set(stockItems.map(i => i.id))].sort();
      const allFilters = ['all', ...productIds, ...groups.map(g => 'group:' + g.name)];

      allFilters.forEach(f => {
        const chip = document.createElement('button');
        chip.className = `chip ${activeFilter === f ? 'active' : ''}`;
        if (f === 'all') chip.textContent = 'Todos';
        else if (f.startsWith('group:')) chip.textContent = '📁 ' + f.slice(6);
        else chip.textContent = f;
        chip.addEventListener('click', () => { activeFilter = f; renderOperations(); renderFilters(); });
        row.appendChild(chip);
      });
    }

    // --- FILTER LOGIC ---
    function filterItems(indices) {
      let result = indices;

      // Search
      if (searchQuery) {
        result = result.filter(i => {
          const it = stockItems[i];
          return (it.id + it.color + it.size).toLowerCase().includes(searchQuery);
        });
      }

      // Filter
      if (activeFilter !== 'all') {
        if (activeFilter.startsWith('group:')) {
          const gName = activeFilter.slice(6);
          const g = groups.find(gr => gr.name === gName);
          result = g ? result.filter(i => g.items.includes(i)) : [];
        } else {
          result = result.filter(i => stockItems[i].id === activeFilter);
        }
      }

      return result;
    }

    // --- RENDER ITEM ---
    function renderItem(idx) {
      const item = stockItems[idx];
      const div = document.createElement('div');
      div.className = `op-item ${selectedItems.has(idx) ? 'selected' : ''}`;
      div.dataset.idx = idx;

      let stockColor = 'var(--text-primary)';
      if (item.stock === 0) stockColor = 'var(--critical)';
      else if (item.stock <= 3) stockColor = 'var(--warning)';

      div.innerHTML = `
        <div class="op-item__info" data-action="select" data-idx="${idx}" style="cursor:pointer">
          <div class="op-item__title">${item.id}</div>
          <div class="op-item__meta">${item.color} · ${item.size}</div>
        </div>
        <div class="op-item__stock" style="color:${stockColor}">${item.stock}</div>
        <button class="sell-btn" data-sell-index="${idx}" ${item.stock === 0 ? 'disabled style="opacity:0.3"' : ''}>💰 Vender</button>
      `;
      return div;
    }

    // --- RENDER OPERATIONS ---
    function renderOperations() {
      const list = document.getElementById('opList');
      list.innerHTML = '';

      const totalUnits = stockItems.reduce((s, i) => s + i.stock, 0);
      document.getElementById('opUnits').textContent = totalUnits;
      const today = new Date().toISOString().split('T')[0];
      document.getElementById('opSalesToday').textContent = sales.filter(s => s.date === today).length;

      if (stockItems.length === 0) {
        document.getElementById('opEmpty').style.display = 'block';
        return;
      }
      document.getElementById('opEmpty').style.display = 'none';

      renderFilters();
      updateSelectionBar();

      // Render groups
      groups.forEach((group, gi) => {
        const filteredItems = filterItems(group.items);
        if (filteredItems.length === 0 && searchQuery) return; // hide empty groups when searching

        const section = document.createElement('div');
        section.className = 'group-section';

        const isCollapsed = collapsedGroups[group.name] === true;

        const header = document.createElement('div');
        header.className = 'group-header';
        header.innerHTML = `
          <div class="group-header__left">
            <span style="font-size:16px">${isCollapsed ? '▶' : '▼'}</span>
            <span class="group-header__name">📁 ${group.name}</span>
            <span class="group-header__count">${group.items.length}</span>
          </div>
          <div class="group-header__actions">
            <button class="gbtn" data-action="rename-group" data-gi="${gi}" title="Renomear">✏️</button>
            <button class="gbtn" data-action="delete-group" data-gi="${gi}" title="Eliminar grupo">🗑</button>
          </div>
        `;

        // Collapse toggle on left side click
        header.querySelector('.group-header__left').addEventListener('click', () => {
          collapsedGroups[group.name] = !isCollapsed;
          saveData();
          renderOperations();
        });

        section.appendChild(header);

        const content = document.createElement('div');
        content.className = `group-content ${isCollapsed ? 'collapsed' : ''}`;
        filteredItems.forEach(idx => content.appendChild(renderItem(idx)));
        section.appendChild(content);

        list.appendChild(section);
      });

      // Render ungrouped
      const ungrouped = filterItems(ungroupedItems());
      if (ungrouped.length > 0) {
        if (groups.length > 0) {
          const label = document.createElement('div');
          label.className = 'section-label';
          label.textContent = 'Sem grupo';
          label.style.marginTop = groups.length > 0 ? 'var(--space-lg)' : '0';
          list.appendChild(label);
        }
        ungrouped.forEach(idx => list.appendChild(renderItem(idx)));
      }
    }

    // --- SELECTION ---
    document.getElementById('opList').addEventListener('click', (e) => {
      // Select toggle
      const selEl = e.target.closest('[data-action="select"]');
      if (selEl) {
        const idx = Number(selEl.dataset.idx);
        if (selectedItems.has(idx)) selectedItems.delete(idx);
        else selectedItems.add(idx);
        renderOperations();
        return;
      }

      // Group actions
      const renameBtn = e.target.closest('[data-action="rename-group"]');
      if (renameBtn) {
        const gi = Number(renameBtn.dataset.gi);
        const newName = prompt('Nome do grupo:', groups[gi].name);
        if (newName && newName.trim()) {
          const oldName = groups[gi].name;
          groups[gi].name = newName.trim();
          // Update collapsed key
          if (collapsedGroups[oldName] !== undefined) {
            collapsedGroups[newName.trim()] = collapsedGroups[oldName];
            delete collapsedGroups[oldName];
          }
          saveData(); renderOperations(); renderFilters();
          showToast('Grupo renomeado', 'success');
        }
        return;
      }

      const deleteBtn = e.target.closest('[data-action="delete-group"]');
      if (deleteBtn) {
        const gi = Number(deleteBtn.dataset.gi);
        if (confirm(`Eliminar grupo "${groups[gi].name}"? Os artigos voltam para "Sem grupo".`)) {
          delete collapsedGroups[groups[gi].name];
          groups.splice(gi, 1);
          saveData(); renderOperations(); renderFilters();
          showToast('Grupo eliminado', 'success');
        }
        return;
      }

      // Sell button
      const sellBtn = e.target.closest('[data-sell-index]');
      if (sellBtn && !sellBtn.disabled) {
        openSellModal(Number(sellBtn.dataset.sellIndex));
      }
    });

    function updateSelectionBar() {
      const bar = document.getElementById('selectionBar');
      if (selectedItems.size > 0) {
        bar.classList.add('active');
        document.getElementById('selCount').textContent = `${selectedItems.size} selecionado${selectedItems.size > 1 ? 's' : ''}`;
      } else {
        bar.classList.remove('active');
      }
    }

    document.getElementById('selCancel').addEventListener('click', () => {
      selectedItems.clear();
      renderOperations();
    });

    // Remove from group
    document.getElementById('selRemove').addEventListener('click', () => {
      selectedItems.forEach(idx => {
        groups.forEach(g => {
          g.items = g.items.filter(i => i !== idx);
        });
      });
      selectedItems.clear();
      saveData(); renderOperations();
      showToast('Artigos removidos do grupo', 'success');
    });

    // Move to group
    document.getElementById('selMove').addEventListener('click', () => {
      const moveModal = document.getElementById('moveModal');
      const list = document.getElementById('moveGroupList');
      list.innerHTML = '';

      if (groups.length === 0) {
        list.innerHTML = '<p class="text-sm text-secondary" style="text-align:center;padding:var(--space-md)">Cria um grupo primeiro.</p>';
      } else {
        groups.forEach((g, gi) => {
          const btn = document.createElement('button');
          btn.className = 'btn btn--secondary';
          btn.style.cssText = 'width:100%;margin-bottom:8px;justify-content:flex-start';
          btn.textContent = '📁 ' + g.name;
          btn.addEventListener('click', () => {
            // Remove from all groups first, then add to target
            selectedItems.forEach(idx => {
              groups.forEach(gr => { gr.items = gr.items.filter(i => i !== idx); });
              groups[gi].items.push(idx);
            });
            // Deduplicate
            groups[gi].items = [...new Set(groups[gi].items)];
            selectedItems.clear();
            saveData();
            moveModal.classList.remove('active');
            document.body.style.overflow = '';
            renderOperations();
            showToast(`Movido para "${g.name}"`, 'success');
          });
          list.appendChild(btn);
        });
      }

      moveModal.classList.add('active');
      document.body.style.overflow = 'hidden';
    });

    document.getElementById('moveCancel').addEventListener('click', () => {
      document.getElementById('moveModal').classList.remove('active');
      document.body.style.overflow = '';
    });
    document.getElementById('moveModal').addEventListener('click', (e) => {
      if (e.target.id === 'moveModal') { e.target.classList.remove('active'); document.body.style.overflow = ''; }
    });

    // --- NEW GROUP ---
    document.getElementById('addGroupBtn').addEventListener('click', () => {
      const name = prompt('Nome do grupo:');
      if (name && name.trim()) {
        groups.push({ name: name.trim(), items: [] });
        saveData(); renderOperations(); renderFilters();
        showToast('Grupo criado', 'success');
      }
    });

    // --- SELL MODAL ---
    let sellingIndex = null;
    const sellModal = document.getElementById('sellModal');

    function openSellModal(idx) {
      sellingIndex = idx;
      const item = stockItems[idx];
      document.getElementById('sellInfo').innerHTML = `
        <div class="card card--glass" style="padding:var(--space-md)">
          <div class="text-base font-semibold">${item.id}</div>
          <div class="text-sm text-secondary">${item.color} · ${item.size} · Stock: ${item.stock}</div>
        </div>
      `;
      document.getElementById('sm_qty').value = 1;
      document.getElementById('sm_qty').max = item.stock;
      document.getElementById('sm_price').value = '';
      sellModal.classList.add('active');
      document.body.style.overflow = 'hidden';
    }

    document.getElementById('sellCancel').onclick = () => { sellModal.classList.remove('active'); document.body.style.overflow = ''; };
    sellModal.addEventListener('click', (e) => { if (e.target === sellModal) { sellModal.classList.remove('active'); document.body.style.overflow = ''; } });

    document.getElementById('sellConfirm').onclick = () => {
      const item = stockItems[sellingIndex];
      const qty = Number(document.getElementById('sm_qty').value) || 1;
      const sellValue = Number(document.getElementById('sm_price').value);

      if (!sellValue || sellValue <= 0) { alert('Introduz o valor da venda.'); return; }
      if (qty > item.stock) { alert('Quantidade superior ao stock.'); return; }

      const cost = costPrices[item.id] || 0;
      sales.push({
        date: new Date().toISOString().split('T')[0],
        timestamp: Date.now(),
        productId: item.id, color: item.color, size: item.size,
        qty, sellValue, costValue: cost * qty,
        profit: sellValue - (cost * qty)
      });

      item.stock -= qty;
      saveData();
      sellModal.classList.remove('active');
      document.body.style.overflow = '';
      renderOperations();
      showToast(`Venda registada: ${sellValue.toFixed(2)}€`, 'success');
    };

    // --- ANALYTICS ---
    function renderAnalytics() {
      const totalInvestment = stockItems.reduce((s, i) => s + (i.stock * (costPrices[i.id] || 0)), 0);
      const totalRevenue = sales.reduce((s, sale) => s + sale.sellValue, 0);
      const totalCostSold = sales.reduce((s, sale) => s + sale.costValue, 0);
      const totalProfit = totalRevenue - totalCostSold;
      const margin = totalRevenue > 0 ? (totalProfit / totalRevenue * 100) : 0;

      document.getElementById('anInvestment').textContent = totalInvestment.toFixed(2) + '€';
      document.getElementById('anRevenue').textContent = totalRevenue.toFixed(2) + '€';

      const profitEl = document.getElementById('anProfit');
      profitEl.textContent = totalProfit.toFixed(2) + '€';
      profitEl.className = `stat-card__value ${totalProfit >= 0 ? 'positive' : 'negative'}`;

      const marginEl = document.getElementById('anMargin');
      marginEl.textContent = margin.toFixed(1) + '%';
      marginEl.className = `stat-card__value ${margin >= 0 ? 'positive' : 'negative'}`;

      document.getElementById('anSalesCount').textContent = sales.length;

      const hc = document.getElementById('salesHistory');
      hc.innerHTML = '';
      if (sales.length === 0) {
        hc.innerHTML = '<div class="empty-state" style="padding:var(--space-lg)"><div style="font-size:32px;opacity:0.5;margin-bottom:8px">📋</div><p class="text-sm text-secondary">Nenhuma venda registada.</p></div>';
        return;
      }
      [...sales].reverse().forEach(sale => {
        const row = document.createElement('div');
        row.className = 'sale-row';
        const pc = sale.profit >= 0 ? 'positive' : 'negative';
        const ps = sale.profit >= 0 ? '+' : '';
        row.innerHTML = `
          <div><div class="sale-product">${sale.productId}</div><div class="sale-date">${sale.date} · ${sale.color} · ${sale.size} · x${sale.qty}</div></div>
          <div style="text-align:right"><div class="sale-amount">${sale.sellValue.toFixed(2)}€</div><div class="sale-profit ${pc}">${ps}${sale.profit.toFixed(2)}€</div></div>
        `;
        hc.appendChild(row);
      });
    }

    // --- TOAST ---
    function showToast(message, type = "success") {
      const existing = document.querySelector('.toast-notification');
      if (existing) existing.remove();
      const toast = document.createElement("div");
      toast.className = `toast-notification badge badge--${type}`;
      toast.textContent = message;
      Object.assign(toast.style, { position:"fixed", top:"calc(70px + env(safe-area-inset-top, 0px))", left:"50%", transform:"translateX(-50%)", zIndex:"1000", padding:"12px 24px", fontSize:"14px", boxShadow:"var(--shadow-lg)", animation:"slideDown 0.3s ease-out" });
      document.body.appendChild(toast);
      setTimeout(() => { toast.style.opacity = "0"; toast.style.transition = "opacity 0.3s"; setTimeout(() => toast.remove(), 300); }, 2000);
    }

    // --- INIT ---
    renderOperations();
  </script>

  <script>
    const savedTheme = localStorage.getItem('dripdrop-theme') || 'dark';
    document.documentElement.setAttribute('data-theme', savedTheme);
  </script>
</body>
</html>
